name: azna_btabana_96
description: عزنا بطبعنا - اليوم الوطني السعودي 96
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  image_picker: ^1.1.2
  http: ^1.2.2
  universal_html: ^2.2.4
  heic_to_png_jpg: ^0.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/identity/
    - assets/wallpapers/

  fonts:
    - family: SaudiWeb
      fonts:
        - asset: assets/fonts/SaudiWeb-Regular.woff2
        - asset: assets/fonts/SaudiWeb-Bold.woff2
          weight: 700